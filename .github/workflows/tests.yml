name: Tests

# Work is pushed to `dev`. Every push runs the tests on two Python versions; only if they pass is `main` moved to
# the same commit. Streamlit Cloud deploys `main`, so a broken push never reaches the public app.
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: App starts without errors
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("app.py", default_timeout=600)
          at.run()
          errs = [("start", e.value) for e in at.exception]
          years = [int(o[2:6]) for o in at.selectbox(key="asof").options] if not errs else []
          for mode in ["Individual vs industry average", "Peer company review"]:
              [s for s in at.selectbox if s.label == "2 · Analysis type"][0].set_value(mode)
              for y in years[:2]:                      # latest year and one past year
                  at.session_state["asof"] = y
                  for section in ["Analyse", "Monitor", "Decide", "Method"]:
                      at.session_state["section"] = section
                      at.run()
                      errs += [(f"{mode[:4]} FY{y} {section}", e.value) for e in at.exception]
          print("exceptions:", errs)
          assert not errs, errs
          PY

  promote:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move main (the deployed branch) to this commit
        run: git push origin HEAD:refs/heads/main      # fast-forward only: refuses if main has commits dev lacks
