name: Nightly data snapshot

# Fetches every company from Yahoo Finance and Google News each night and publishes snapshot.json.gz and
# history.csv on the `data` branch (one commit, replaced nightly, so the repository does not grow).
on:
  schedule:
    - cron: "30 0 * * *"          # 06:00 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/build_snapshot.py", "snapshot.py", ".github/workflows/snapshot.yml"]

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Get the previous snapshot (fallback for anything that fails tonight)
        run: git clone --depth 1 --branch data "https://github.com/${{ github.repository }}.git" prev || mkdir -p prev
      - name: Build
        run: python scripts/build_snapshot.py --prev prev --out out
      - name: Publish to the data branch
        run: |
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
